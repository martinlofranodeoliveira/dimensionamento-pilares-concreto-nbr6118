<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background-color: #0b1120; font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metalAco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
    </marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo com grid sutil -->
  <rect width="1440" height="900" fill="#0b1120" />
  <rect width="1440" height="900" fill="url(#gridPattern)" />

  <!-- Cabeçalho Principal -->
  <rect x="30" y="25" width="1380" height="85" rx="12" fill="url(#headerGrad)" filter="url(#cardShadow)" />
  <text x="60" y="60" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">LOFRANO TECNOLOGIA — ENGENHARIA ESTRUTURAL DETERMINÍSTICA</text>
  <text x="60" y="88" font-size="14" font-weight="500" fill="#bae6fd">DIMENSIONAMENTO DE PILARES DE CONCRETO ARMADO — ABNT NBR 6118:2023 | MOTOR ZERO FLOAT</text>

  <rect x="1170" y="45" width="210" height="42" rx="8" fill="#0f172a" opacity="0.75" />
  <circle cx="1195" cy="66" r="9" fill="#10b981" />
  <text x="1215" y="72" font-size="15" font-weight="700" fill="#ffffff">APROVADO</text>

  <!-- Painel Esquerdo: Seção Transversal Detalhada Cotada -->
  <rect x="30" y="130" width="500" height="480" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <text x="55" y="165" font-size="16" font-weight="700" fill="#38bdf8">1. SEÇÃO TRANSVERSAL E ARMADURAS (20.0 x 40.0 cm)</text>

  <!-- Retângulo do Concreto -->
  <rect x="210.0" y="200.0" width="140.0" height="280.0" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Estribo Transversal -->
  <rect x="231.0" y="221.0" width="98.0" height="238.0" rx="4" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,2" />

  <!-- Barras Longitudinais -->
  <circle cx="236.6" cy="226.6" r="5.6" fill="url(#metalAco)" stroke="#0f172a" stroke-width="1.5" /><circle cx="323.4" cy="226.6" r="5.6" fill="url(#metalAco)" stroke="#0f172a" stroke-width="1.5" /><circle cx="236.6" cy="453.4" r="5.6" fill="url(#metalAco)" stroke="#0f172a" stroke-width="1.5" /><circle cx="323.4" cy="453.4" r="5.6" fill="url(#metalAco)" stroke="#0f172a" stroke-width="1.5" />

  <!-- Linhas de Cota de Largura b e Altura h -->
  <line x1="210.0" y1="505.0" x2="350.0" y2="505.0" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="280.0" y="525.0" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">b = 20,0 cm</text>

  <line x1="375.0" y1="200.0" x2="375.0" y2="480.0" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="395.0" y="340.0" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="start">h = 40,0 cm</text>

  <!-- Legenda das Armaduras -->
  <text x="55" y="555" font-size="13" font-weight="500" fill="#94a3b8">Longitudinal: <tspan font-weight="700" fill="#38bdf8">4 Φ 12,5 mm (As = 4,91 cm²)</tspan></text>
  <text x="55" y="580" font-size="13" font-weight="500" fill="#94a3b8">Estribos: <tspan font-weight="700" fill="#f59e0b">Φ 5,0 mm c/ 15,0 cm</tspan> | Cobrimento cnom = 3,0 cm</text>

  <!-- Painel Central: Elevação e Efeitos de 2ª Ordem -->
  <rect x="550" y="130" width="370" height="480" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <text x="575" y="165" font-size="16" font-weight="700" fill="#38bdf8">2. ANÁLISE DE ESBELTEZ E 2ª ORDEM</text>

  <!-- Eixo Indeformado -->
  <line x1="730.0" y1="180.0" x2="730.0" y2="500.0" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Curva Deformada de 2ª Ordem -->
  <path d="M 730.0 180.0 Q 750.0 340.0 730.0 500.0" fill="none" stroke="#f43f5e" stroke-width="3.5" />

  <!-- Vetores de Carga e Momento -->
  <line x1="730.0" y1="145.0" x2="730.0" y2="175.0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <text x="715.0" y="165.0" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="end">Nsd</text>

  <path d="M 745.0 155.0 A 15 15 0 0 1 765.0 175.0" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="775.0" y="168.0" font-size="12" font-weight="700" fill="#f59e0b">M1d</text>

  <!-- Flecha de Excentricidade etot -->
  <line x1="730.0" y1="340.0" x2="750.0" y2="340.0" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#arrowMagenta)" />
  <text x="762.0" y="344.0" font-size="12" font-weight="700" fill="#f43f5e">etot = 4,27 cm</text>

  <text x="575" y="535" font-size="13" font-weight="500" fill="#94a3b8">Índice Esbeltez: <tspan font-weight="700" fill="#38bdf8">λ = 26,0</tspan> (Limite: 35,0)</text>
  <text x="575" y="560" font-size="13" font-weight="500" fill="#94a3b8">Excentricidades: <tspan font-weight="600" fill="#bae6fd">e1=3,08 | ea=1,50 | e2=0,00 cm</tspan></text>
  <text x="575" y="585" font-size="13" font-weight="500" fill="#94a3b8">Momento Total Msd: <tspan font-weight="700" fill="#f59e0b">38,85 kN·m</tspan></text>

  <!-- Painel Direito: Memória Normativa e Verificações -->
  <rect x="940" y="130" width="470" height="740" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <text x="965" y="165" font-size="16" font-weight="700" fill="#38bdf8">3. SÍNTESE DO DIMENSIONAMENTO E ELU</text>

  <g transform="translate(965, 195)" font-size="13">
    <!-- Bloco 1: Geometria e Materiais -->
    <rect x="0" y="0" width="420" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" font-weight="700" fill="#38bdf8">PARÂMETROS GEOMÉTRICOS E MATERIAIS</text>
    <text x="15" y="46" fill="#94a3b8">Seção Bruta: <tspan font-weight="600" fill="#ffffff">20,0 x 40,0 cm (Ac = 800,0 cm²)</tspan></text>
    <text x="15" y="66" fill="#94a3b8">Materiais: <tspan font-weight="600" fill="#ffffff">Concreto C25 | Aço CA_50</tspan></text>
    <text x="15" y="86" fill="#94a3b8">Comprimento Efetivo le: <tspan font-weight="600" fill="#ffffff">300,0 cm (γn = 1,00)</tspan></text>

    <!-- Bloco 2: Esforços e Excentricidades -->
    <rect x="0" y="110" width="420" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="134" font-weight="700" fill="#38bdf8">ESFORÇOS SOLICITANTES DE CÁLCULO</text>
    <text x="15" y="156" fill="#94a3b8">Força Normal Nk / Nsd: <tspan font-weight="600" fill="#ffffff">650,0 kN / 910,0 kN</tspan></text>
    <text x="15" y="176" fill="#94a3b8">Excentricidade Total etot: <tspan font-weight="600" fill="#ffffff">4,27 cm (e1+ea+e2)</tspan></text>
    <text x="15" y="196" fill="#94a3b8">Momento Total Msd,tot: <tspan font-weight="600" fill="#ffffff">38,85 kN·m</tspan></text>
    <text x="15" y="216" fill="#94a3b8">Adimensionais: <tspan font-weight="600" fill="#ffffff">ν = 0,637 | μ = 0,068</tspan></text>

    <!-- Bloco 3: Armaduras -->
    <rect x="0" y="240" width="420" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="264" font-weight="700" fill="#38bdf8">DIMENSIONAMENTO DAS ARMADURAS</text>
    <text x="15" y="286" fill="#94a3b8">Armadura Calculada (As,cal): <tspan font-weight="600" fill="#ffffff">0,00 cm²</tspan></text>
    <text x="15" y="306" fill="#94a3b8">Armadura Mínima (As,min): <tspan font-weight="600" fill="#ffffff">3,20 cm²</tspan></text>
    <text x="15" y="326" fill="#94a3b8">Armadura Adotada Efetiva: <tspan font-weight="700" fill="#38bdf8">4 Φ 12,5 mm (4,91 cm²)</tspan></text>
    <text x="15" y="346" fill="#94a3b8">Taxa de Armadura: <tspan font-weight="600" fill="#ffffff">ρ = 0,40% (Máx: 8,00%)</tspan></text>

    <!-- Bloco 4: Verificações Normativas -->
    <rect x="0" y="370" width="420" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="394" font-weight="700" fill="#38bdf8">VERIFICAÇÕES NORMATIVAS (NBR 6118)</text>
    <text x="15" y="416" fill="#94a3b8">Dimensões Mínimas (b≥14, Ac≥360): <tspan font-weight="700" fill="#10b981">CONFORME</tspan></text>
    <text x="15" y="438" fill="#94a3b8">Esbeltez Admissível (λ ≤ 200): <tspan font-weight="700" fill="#10b981">CONFORME</tspan></text>
    <text x="15" y="460" fill="#94a3b8">Taxa Máxima de Armadura (As ≤ As,max): <tspan font-weight="700" fill="#10b981">CONFORME</tspan></text>
    <text x="15" y="482" fill="#94a3b8">Espaçamento Livre Barras (≥ 2,0 cm): <tspan font-weight="700" fill="#10b981">CONFORME</tspan></text>
    <text x="15" y="504" fill="#94a3b8">Efeitos de 2ª Ordem: <tspan font-weight="600" fill="#bae6fd">Dispensados</tspan></text>
  </g>

  <!-- Painel Inferior: Identificação e Notas -->
  <rect x="30" y="630" width="890" height="240" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
  <text x="55" y="665" font-size="16" font-weight="700" fill="#38bdf8">4. DADOS DO PROJETO E OBSERVAÇÕES EXECUTIVAS</text>
  <text x="55" y="695" font-size="14" font-weight="600" fill="#ffffff">Identificação: Pilar P12 - Edifício Residencial Solar dos Ipês</text>
  <text x="55" y="720" font-size="13" font-weight="400" fill="#94a3b8">• Aritmética 100% Exata: Nenhum ponto flutuante foi utilizado no motor (Zero Float). Todos os cálculos utilizam frações exatas.</text>
  <text x="55" y="742" font-size="13" font-weight="400" fill="#94a3b8">• Efeitos de 2ª Ordem: Avaliados segundo a NBR 6118 item 15.8.3 com curvatura aproximada 1/r e excentricidade acidental ea.</text>
  <text x="55" y="764" font-size="13" font-weight="400" fill="#94a3b8">• Detalhamento Construtivo: Estribos com ganchos padronizados de 135° e cobrimento nominal garantido segundo a CAA CAA_II.</text>

  <!-- Rodapé de Autoria -->
  <line x1="55" y1="790" x2="895" y2="790" stroke="#334155" stroke-width="1" />
  <text x="55" y="818" font-size="13" font-weight="600" fill="#bae6fd">LOFRANO TECNOLOGIA — Engenharia de Software e Confiabilidade Estrutural</text>
  <text x="55" y="840" font-size="12" font-weight="400" fill="#64748b">Biblioteca Aberta e Determinística | Licença MIT | https://github.com/martinlofranodeoliveira</text>
</svg>

